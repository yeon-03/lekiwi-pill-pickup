# 이름 붙인 목적지.  map 프레임 좌표계 (yaw 는 도).
#
# 좌표는 지도마다 다르다 -- 지도의 (0,0) 은 그 SLAM 을 시작한 자리이므로,
# 지도를 새로 따면 여기 값도 다시 잡아야 한다.
# 현재 기준 지도: map_0827_1534_clean
map: map_0827_1534_clean

points:
  home:    {x:  0.00, y:  0.00, yaw:   0.0}   # SLAM 시작 지점 = 바닥 표시 자리
  center:  {x:  1.50, y:  0.58, yaw:   0.0}   # 실제로 주행 성공한 지점
  upper:   {x:  1.10, y:  1.40, yaw:  90.0}   # 위쪽 방
