# 이름 붙인 목적지.  map 프레임 좌표계 (yaw 는 도).
#
# 좌표는 지도마다 다르다 -- 지도의 (0,0) 은 그 SLAM 을 시작한 자리이므로,
# 지도를 새로 따면 여기 값도 다시 잡아야 한다.
# 현재 기준 지도: map_0912_1654 (lekiwi01, 2026-09-12, nav/maps/lekiwi01/)
map: map_0912_1654

points:
  home:    {x:  0.00, y:  0.00, yaw:  0.0}   # SLAM·AMCL 시작 지점
  center:  {x:  1.10, y: -0.10, yaw:  0.0}   # 약통 자리. 2026-09-12 RViz Nav2 Goal 로 도착한 지점, 정면 0도
                                             # ⚠ 이 목표로 가는 계획이 두 번 실패한 뒤 성공했다 -- 약통 받침
                                             #   팽창 영역에 가까울 수 있다. 실패가 잦으면 약간 앞으로 옮길 것.

# 이전 지도(lekiwi06, map_0827_1534_clean) 값 -- 그 지도로 돌아갈 때만 쓴다:
#   center: {x: 1.50, y: 0.58, yaw: 0.0}
#   upper:  {x: 1.10, y: 1.40, yaw: 90.0}
