<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeKiwi 관제</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="console">
  <div class="top">
    <header class="strip">
      <span class="brand">LeKiwi 01</span>
      <span class="chip" id="conn"><i class="dot"></i><span>연결 중…</span></span>
      <span class="chip state" id="mission-chip">대기</span>
      <span class="target-badge none" id="target-badge">목표 없음</span>
      <span class="chip mono" id="elapsed">–</span>
      <span class="spacer"></span>
      <button class="btn" id="font-down" type="button" aria-label="글자 작게">가−</button>
      <button class="btn" id="font-up" type="button" aria-label="글자 크게">가+</button>
      <span class="estop-note">확실한 비상정지는 로봇 전원 스위치</span>
      <button class="estop" id="stop-btn" type="button">정지</button>
    </header>

    <div class="banner danger" id="latch-banner" hidden>
      <span>정지 유지 중 — 로봇이 움직이려 하면 계속 멈춥니다</span>
      <span class="mono" id="latch-info"></span>
      <button class="btn" id="release-btn" type="button">해제</button>
    </div>
    <div class="banner warn" id="warn-banner" hidden></div>
  </div>

  <main class="body">
    <section class="pane map-pane">
      <div class="pane-title"><span>지도</span><span class="mono" id="pose-info">위치 없음</span></div>
      <div class="map-box"><canvas id="map" aria-label="Nav2 지도"></canvas></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="pane mission" id="mission-pane">
      <div class="pane-title"><span>미션 진행</span></div>
      <p class="headline" id="headline" aria-live="polite">미션 없음 — fetch 명령을 기다리는 중</p>
      <p class="status-text" id="status-text"></p>
      <ol class="flow" id="stages"></ol>
    </section>

    <section class="pane cams">
      <div class="pane-title"><span>YOLO 카메라 <span class="cam-target" id="cam-title-target"></span></span><span class="mono">front · wrist</span></div>
      <div class="cam-slot">
        <figure class="cam" id="cam-front" data-view="front">
          <img alt="front 카메라">
          <figcaption class="cam-label"><span>front</span><span class="cam-meta"></span></figcaption>
          <div class="cam-bar"></div>
          <div class="cam-empty">집기 단계에서 켜져요</div>
        </figure>
      </div>
      <div class="cam-slot">
        <figure class="cam" id="cam-wrist" data-view="wrist">
          <img alt="wrist 카메라">
          <figcaption class="cam-label"><span>wrist</span><span class="cam-meta"></span></figcaption>
          <div class="cam-bar"></div>
          <div class="cam-empty">집기 단계에서 켜져요</div>
        </figure>
      </div>
    </section>
  </main>

  <footer class="topics-bar">
    <span class="topics-label">토픽</span>
    <span class="topics-summary" id="topics-summary"></span>
    <button class="btn" id="topics-toggle" type="button" aria-expanded="false" aria-controls="topics-drawer">토픽 자세히</button>
  </footer>
</div>

<div class="drawer" id="topics-drawer" hidden>
  <section class="pane drawer-pane" role="dialog" aria-label="토픽 입력 / 출력">
    <div class="pane-title"><span>토픽 · 입력 / 출력</span><span class="mono">노트북이 받은 시각 기준</span>
      <button class="btn" id="topics-close" type="button">닫기</button></div>
    <div class="io" id="topics"></div>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
