<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LeKiwi Pick&Place</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  .views { display: flex; gap: 12px; flex-wrap: wrap; }
  .views img { width: 480px; max-width: 100%; border: 2px solid #444; border-radius: 4px; }
  .controls { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { font-size: 18px; padding: 10px 18px; border-radius: 6px; border: none; cursor: pointer; }
  #start { background: #2ecc71; color: #000; }
  #pause { background: #f1c40f; color: #000; }
  #restart { background: #3498db; color: #fff; }
  #home { background: #9b59b6; color: #fff; }
  #stop { background: #7f8c8d; color: #fff; }
  #estop { background: #e74c3c; color: #fff; font-weight: bold; font-size: 22px; padding: 14px 24px; }
  .targets { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .targets button { opacity: 0.55; border: 3px solid transparent; }
  .targets button.active { opacity: 1; border-color: #fff; }
  #target-red { background: #e74c3c; color: #fff; }
  #target-green { background: #2ecc71; color: #000; }
  #target-blue { background: #3498db; color: #fff; }
  #target-none { background: #34495e; color: #fff; }
  #status { margin-top: 16px; font-family: monospace; white-space: pre-wrap; background: #222; padding: 10px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>LeKiwi Pick&Place</h1>
  <div class="views">
    <img src="/stream/front" alt="front">
    <img src="/stream/wrist" alt="wrist">
  </div>
  <div class="controls">
    <button id="start">▶ 시작</button>
    <button id="pause">❚❚ 일시정지</button>
    <button id="restart">🔄 다시 시도</button>
    <button id="home">🏠 처음 자세로</button>
    <button id="stop">■ 정지 (연결 종료)</button>
    <button id="estop">⚠ 비상정지</button>
  </div>
  <div class="targets">
    <span>타겟 색:</span>
    <button id="target-red">🔴 빨강만</button>
    <button id="target-green">🟢 초록만</button>
    <button id="target-blue">🔵 파랑만</button>
    <button id="target-none">전체</button>
  </div>
  <pre id="status">연결 중...</pre>

<script>
  async function post(path) {
    await fetch(path, { method: "POST" });
  }
  document.getElementById("start").onclick = () => post("/start");
  document.getElementById("pause").onclick = () => post("/pause");
  document.getElementById("restart").onclick = () => post("/restart");
  document.getElementById("home").onclick = () => post("/home");
  document.getElementById("stop").onclick = () => post("/stop");
  document.getElementById("estop").onclick = () => post("/estop");
  document.getElementById("target-red").onclick = () => post("/target/red_pill_bottle");
  document.getElementById("target-green").onclick = () => post("/target/green_pill_bottle");
  document.getElementById("target-blue").onclick = () => post("/target/blue_pill_bottle");
  document.getElementById("target-none").onclick = () => post("/target/none");

  function updateTargetButtons(targetClass) {
    const map = { red_pill_bottle: "target-red", green_pill_bottle: "target-green", blue_pill_bottle: "target-blue" };
    const activeId = map[targetClass] || "target-none";
    for (const id of ["target-red", "target-green", "target-blue", "target-none"]) {
      document.getElementById(id).classList.toggle("active", id === activeId);
    }
  }

  async function pollStatus() {
    try {
      const resp = await fetch("/status");
      const data = await resp.json();
      document.getElementById("status").textContent = JSON.stringify(data, null, 2);
      updateTargetButtons(data.target_class);
    } catch (e) {
      document.getElementById("status").textContent = "상태 조회 실패: " + e;
    }
  }
  setInterval(pollStatus, 300);
  pollStatus();
</script>
</body>
</html>
